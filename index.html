<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VOICECHAT</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>VOICECHAT</h1>

  <label>Room:</label>
  <input id="room" maxlength="4" placeholder="A7K2" />

  <label>Input:</label>
  <select id="inputSel"></select>

  <label>Output:</label>
  <select id="outputSel"></select>

  <button id="joinBtn">JOIN</button>
  <button id="leaveBtn" style="display:none">LEAVE</button>

  <p id="usersLine" style="display:none">Users: <span id="userCount">1</span></p>
  <p>Status: <span id="status">Disconnected</span></p>
  <script type="module" src="app.js"></script>

</body>
</html>
