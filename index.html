<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenSignal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>OpenSignal</h1>

  <label>Name:</label>
  <input id="name" maxlength="24" placeholder="Your name" autocomplete="name" />

  <label>Room:</label>
  <input id="room" maxlength="4" placeholder="A7K2" />

  <label>Input:</label>
  <select id="inputSel"></select>

  <label>Output:</label>
  <select id="outputSel"></select>

  <button id="joinBtn">JOIN</button>
  <button id="leaveBtn" style="display:none">LEAVE</button>
  <div id="selfControls" hidden>
    <button id="muteBtn" type="button">MUTE</button>
    <button id="deafenBtn" type="button">DEAFEN</button>
  </div>

  <div id="usersLine" hidden>
    <p>Users: <span id="userCount">1</span></p>
    <div id="participants"></div>
  </div>
  <p>Status: <span id="status">Disconnected</span></p>
  <script type="module" src="app.js"></script>

</body>
</html>
